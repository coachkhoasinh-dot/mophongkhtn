                ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(canvas.width,oy); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=3; ctx.stroke();
                
                const rad1 = this.state.angleIncidence*Math.PI/180; const rL = Math.max(canvas.width, canvas.height);
                const inX = ox - rL*Math.sin(rad1), inY = oy - rL*Math.cos(rad1);
                
                // Tia tới
                this.drawRay(ox,oy, inX,inY, ox,oy, colors.danger, 4, true);
                
                let hudT = "";
                const sinT2 = (this.state.n1 / this.state.n2) * Math.sin(rad1);
                
                if(Math.abs(sinT2) > 1.0) {
                    // Phản xạ toàn phần
                    this.drawRay(ox, oy, ox, oy, ox+rL*Math.sin(rad1), oy-rL*Math.cos(rad1), colors.danger, 4, true);
                    hudT = '<span class="text-rose-400 font-bold animate-pulse">Phản xạ toàn phần!</span>';
                } else {
                    // Khúc xạ
                    const r2 = Math.asin(sinT2);
                    this.drawRay(ox, oy, ox, oy, ox+rL*Math.sin(r2), oy+rL*Math.cos(r2), colors.danger, 4, true);
                    // Phản xạ yếu
                    this.drawRay(ox, oy, ox, oy, ox+rL*Math.sin(rad1), oy-rL*Math.cos(rad1), 'rgba(244, 63, 94, 0.2)', 2, false);
                    hudT = `Góc khúc xạ (θ₂): <span style="color:${colors.physics}">${(r2 * 180 / Math.PI).toFixed(1)}°</span>`;
                }

                hudInfo.innerHTML = `<div>Môi trường 1 (n₁): <span style="color:${colors.physics}">${this.state.n1.toFixed(2)}</span></div>
                                     <div>Môi trường 2 (n₂): <span style="color:${colors.physics}">${this.state.n2.toFixed(2)}</span></div>
                                     <div class="mt-2">Góc tới (θ₁): <span style="color:${colors.physics}">${this.state.angleIncidence.toFixed(1)}°</span></div>
                                     <div>${hudT}</div>`;
            },
            loop() { if(currentSim !== 'optics') return; this.draw(); animationId = requestAnimationFrame(() => this.loop()); }
        }

        // ==========================================
        // CHEMISTRY SIMULATION: CHUẨN ĐỘ & QUỲ TÍM
        // ==========================================
        simulations.titration = {
            state: { 
                volume: 50, pH: 7.0, acidStrength: 1.0, baseStrength: 1.0, 
                drops: [], bubbles: [], stirAngle: 0,
                litmus: { active: false, phase: 0, y: 0, color: '#fef08a', waitTimer: 0 } 
            },
            origin: { x: 0, y: 0 },
            initPositions() { this.origin.x = canvas.width / 2; this.origin.y = canvas.height - 50; },
            init() { this.initPositions(); this.reset(); canvas.onmousedown = null; canvas.onmousemove = null; this.loop(); },
            reset() { 
                this.state.volume = 50; this.state.pH = 7.0; this.state.drops = []; this.state.bubbles = []; 
                this.state.litmus = { active: false, phase: 0, y: 0, color: '#fef08a', waitTimer: 0 };
                document.getElementById('chem-acid-val') && (document.getElementById('chem-acid').value = 1); 
                document.getElementById('chem-base-val') && (document.getElementById('chem-base').value = 1); 
            },
            addDrop(type) {
                if(this.state.volume >= 200 || this.state.litmus.active) return;
                let c = type === 'acid' ? '#fca5a5' : (type === 'base' ? '#93c5fd' : '#e0f2fe');
                this.state.drops.push({ x: this.origin.x + (Math.random()*10 - 5), y: this.origin.y - 250, vy: 0, type: type, color: c });
            },
            dipLitmus() {
                if(!this.state.litmus.active) {
                    this.state.litmus.active = true;
                    this.state.litmus.phase = 0; // 0: down, 1: wait, 2: up
                    this.state.litmus.y = this.origin.y - 400; // Start high
                    this.state.litmus.color = '#fef08a'; // Vàng nhạt (Neutral paper)
                }
            },
            getPhColor(pH) {
                if (pH < 7) { const ratio = (pH - 1) / 6; const r = 239; const g = Math.floor(68 + ratio * (197 - 68)); const b = Math.floor(68 + ratio * (94 - 68)); return `rgba(${r}, ${g}, ${b}, 0.7)`; }
                else { const ratio = (pH - 7) / 7; const r = Math.floor(34 + ratio * (147 - 34)); const g = Math.floor(197 - ratio * (147)); const b = Math.floor(94 + ratio * (253 - 94)); return `rgba(${r}, ${g}, ${b}, 0.7)`; }
            },
            update() {
                if(isPaused) return;

                // Cập nhật giọt dung dịch
                for(let i = this.state.drops.length - 1; i >= 0; i--) {
                    let d = this.state.drops[i]; d.vy += 0.5; d.y += d.vy;
                    const liquidLevelY = this.origin.y - this.state.volume;
                    if(d.y >= liquidLevelY) {
                        this.state.volume = Math.min(200, this.state.volume + 2);
                        if (d.type === 'water') {
                            this.state.pH = this.state.pH + (7 - this.state.pH) * (2 / this.state.volume); // Nước kéo pH về mốc 7
                        } else {
                            let impact = d.type === 'acid' ? -this.state.acidStrength : this.state.baseStrength;
                            this.state.pH = Math.max(1, Math.min(14, this.state.pH + impact * (50 / this.state.volume)));
                        }
                        if (Math.abs(this.state.pH - 7) < 2) { for(let b=0; b<3; b++) { this.state.bubbles.push({ x: d.x + (Math.random()*20-10), y: liquidLevelY, vy: -Math.random()*2 - 1, size: Math.random()*4 + 2, life: 1.0 }); } }
                        this.state.drops.splice(i, 1);
                    }
                }

                // Cập nhật bọt khí
                for(let i = this.state.bubbles.length - 1; i >= 0; i--) {
                    let b = this.state.bubbles[i]; b.y += b.vy; b.x += Math.sin(globalTime*0.1 + b.y)*1; b.life -= 0.02;
                    if(b.life <= 0 || b.y < this.origin.y - 250) this.state.bubbles.splice(i, 1);
                }
                this.state.stirAngle += 0.1; globalTime++;

                // Cập nhật Hoạt ảnh Quỳ Tím
                if(this.state.litmus.active) {
                    const liquidY = this.origin.y - this.state.volume;
                    if(this.state.litmus.phase === 0) { // Đi xuống
                        this.state.litmus.y += 4;
                        if(this.state.litmus.y + 70 >= liquidY) { // Chạm nước
                            this.state.litmus.phase = 1;
                            this.state.litmus.waitTimer = 40; // Đứng yên 40 frames
                            // Đổi màu giấy quỳ dựa theo pH
                            if(this.state.pH < 6.0) this.state.litmus.color = '#ef4444'; // Đỏ (Axit)
                            else if(this.state.pH > 8.0) this.state.litmus.color = '#3b82f6'; // Xanh (Bazơ)
                            else this.state.litmus.color = '#a855f7'; // Tím (Trung tính)
                        }
                    } else if (this.state.litmus.phase === 1) { // Đứng yên đổi màu
                        this.state.litmus.waitTimer--;
                        if(this.state.litmus.waitTimer <= 0) this.state.litmus.phase = 2;
                    } else if (this.state.litmus.phase === 2) { // Rút lên
                        this.state.litmus.y -= 4;
                        if(this.state.litmus.y <= this.origin.y - 400) this.state.litmus.active = false;
                    }
                }

                let nature = this.state.pH < 6.5 ? "Tính Axit" : (this.state.pH > 7.5 ? "Tính Bazơ" : "Trung Tính");
                hudInfo.innerHTML = `
                    <div class="text-chem-400 font-bold mb-1"><i class="fa-solid fa-flask"></i> Pha chế dung dịch</div>
                    <div>Chỉ số pH: <span style="color:${this.getPhColor(this.state.pH).replace(', 0.7)', ')')}">${this.state.pH.toFixed(2)}</span></div>
                    <div>Môi trường: <span class="text-white">${nature}</span></div>
                    <div>Thể tích: <span class="text-white">${this.state.volume.toFixed(0)} ml</span></div>
                `;
            },
            draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); const ox = this.origin.x; const oy = this.origin.y;
                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, oy, canvas.width, canvas.height - oy);
                ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(canvas.width, oy); ctx.strokeStyle = '#334155'; ctx.lineWidth = 4; ctx.stroke();
                const liqY = oy - this.state.volume; const flaskW = 120;
                
                // Vẽ nước trong bình
                ctx.save(); ctx.beginPath(); ctx.moveTo(ox - 30, oy - 220); ctx.lineTo(ox - 30, oy - 120);
                ctx.bezierCurveTo(ox - flaskW, oy - 80, ox - flaskW, oy, ox, oy); ctx.bezierCurveTo(ox + flaskW, oy, ox + flaskW, oy - 80, ox + 30, oy - 120); 
                ctx.lineTo(ox + 30, oy - 220); ctx.clip();

                ctx.fillStyle = this.getPhColor(this.state.pH); ctx.beginPath(); ctx.moveTo(ox - flaskW, liqY);
                for(let i = -flaskW; i <= flaskW; i+=10) { let wave = isPaused ? 0 : Math.sin(i*0.05 + this.state.stirAngle) * 5 * (this.state.volume/200); ctx.lineTo(ox + i, liqY + wave); }
                ctx.lineTo(ox + flaskW, oy); ctx.lineTo(ox - flaskW, oy); ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; this.state.bubbles.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill(); });
                ctx.restore();

                // Vẽ vỏ bình
                ctx.beginPath(); ctx.moveTo(ox - 30, oy - 250); ctx.lineTo(ox - 30, oy - 120);
                ctx.bezierCurveTo(ox - flaskW, oy - 80, ox - flaskW, oy, ox, oy); ctx.bezierCurveTo(ox + flaskW, oy, ox + flaskW, oy - 80, ox + 30, oy - 120); 
                ctx.lineTo(ox + 30, oy - 250); ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)'; ctx.lineWidth = 4; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(ox - 35, oy - 250); ctx.lineTo(ox + 35, oy - 250); ctx.lineWidth = 6; ctx.stroke();

                // Vẽ Hoạt ảnh Quỳ Tím (Nằm trong bình, cắm từ trên xuống)
                if(this.state.litmus.active) {
                    const lX = ox + 40; const lY = this.state.litmus.y;
                    
                    ctx.fillStyle = '#64748b'; ctx.fillRect(lX - 2, lY - 40, 24, 40);
                    ctx.fillStyle = '#fef08a'; ctx.fillRect(lX, lY, 20, 50);
                    ctx.fillStyle = this.state.litmus.color; ctx.fillRect(lX, lY + 50, 20, 30);
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.strokeRect(lX, lY, 20, 80);
                }

                this.state.drops.forEach(d => { ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI); ctx.lineTo(d.x, d.y - 12); ctx.fill(); });
            },
            loop() { if(currentSim !== 'titration') return; this.update(); this.draw(); animationId = requestAnimationFrame(() => this.loop()); }
        };

        // ==========================================
        // CHEMISTRY SIMULATION: CÁC PHẢN ỨNG HÓA HỌC
        // ==========================================
        simulations.reactions = {
            state: { activeRx: null, progress: 0, particles: [], bubbles: [], flaskColor: 'rgba(56, 189, 248, 0.2)' },
            origin: { x: 0, y: 0 },
            initPositions() { this.origin.x = canvas.width / 2; this.origin.y = canvas.height - 50; },
            init() { this.initPositions(); this.reset(); this.loop(); },
            reset() { this.state.activeRx = null; this.state.progress = 0; this.state.particles = []; this.state.bubbles = []; this.state.flaskColor = 'transparent'; },
            trigger(type) {
                this.reset();
                this.state.activeRx = type;
                if(type === 'mg_o2') {
                    // Start fire
                } else if (type === 'zn_hcl') {
                    this.state.flaskColor = 'rgba(255, 255, 255, 0.2)'; // HCl trong suốt
                } else if (type === 'cuso4_naoh') {
                    this.state.flaskColor = 'rgba(59, 130, 246, 0.4)'; // CuSO4 xanh lơ
                }
            },
            update() {
                if(isPaused || !this.state.activeRx) return;
                this.state.progress += 0.01;
                const ox = this.origin.x; const oy = this.origin.y;

                if (this.state.activeRx === 'mg_o2') {
                    // Cháy Magie: Lóe sáng trắng và tia lửa
                    if(this.state.progress < 3.0) {
                        for(let i=0; i<5; i++) {
                            this.state.particles.push({
                                x: ox, y: oy - 150,
                                vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15 - 5,
                                life: 1.0, color: Math.random()>0.5 ? '#ffffff' : '#fde047'
                            });
                        }
                    }
                } else if (this.state.activeRx === 'zn_hcl') {
                    // Zn + HCl: Sủi bọt khí H2 liên tục
                    if(this.state.progress < 4.0) {
                        for(let i=0; i<3; i++) {
                            this.state.bubbles.push({
                                x: ox + (Math.random()-0.5)*60, y: oy,
                                vy: -Math.random()*3 - 2, life: 1.0, size: Math.random()*4 + 2
                            });
                        }
                    }
                } else if (this.state.activeRx === 'cuso4_naoh') {
                    // Tạo kết tủa xanh Cu(OH)2
                    if(this.state.progress < 2.5 && Math.random() < 0.3) {
                        this.state.particles.push({
                            x: ox + (Math.random()-0.5)*60, y: oy - 150,
                            vy: Math.random()*2 + 1, life: 1.0, color: '#2563eb', // Xanh đậm kết tủa
                            isPrecipitate: true
                        });
                    }
                }

                // Cập nhật hạt
                for(let i = this.state.particles.length - 1; i >= 0; i--) {
                    let p = this.state.particles[i];
                    p.x += p.vx || 0; p.y += p.vy;
                    if(!p.isPrecipitate) {
                        p.vy += 0.5; // Trọng lực tia lửa
                        p.life -= 0.03;
                    } else {
                        if(p.y > oy - 10) { p.y = oy - 10; p.vy = 0; } // Kết tủa rớt xuống đáy
                    }
                    if(p.life <= 0) this.state.particles.splice(i, 1);
                }

                // Cập nhật bọt
                for(let i = this.state.bubbles.length - 1; i >= 0; i--) {
                    let b = this.state.bubbles[i];
                    b.y += b.vy; b.x += Math.sin(b.y*0.1)*2; b.life -= 0.01;
                    if(b.y < oy - 120 || b.life <= 0) this.state.bubbles.splice(i, 1);
                }

                let rxName = ""; let rxEq = "";
                if(this.state.activeRx === 'mg_o2') { rxName = "Phản ứng cháy (Oxi hóa)"; rxEq = "2Mg + O₂ → 2MgO"; }
                if(this.state.activeRx === 'zn_hcl') { rxName = "Phản ứng thế (Tạo khí)"; rxEq = "Zn + 2HCl → ZnCl₂ + H₂↑"; }
                if(this.state.activeRx === 'cuso4_naoh') { rxName = "Phản ứng trao đổi (Kết tủa)"; rxEq = "CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄"; }

                hudInfo.innerHTML = `
                    <div class="text-chem-400 font-bold mb-1"><i class="fa-solid fa-fire-flame-curved"></i> Mô Phỏng Phản Ứng</div>
                    ${this.state.activeRx ? `<div>Loại: <span class="text-white">${rxName}</span></div>
                    <div class="mt-2 font-mono text-emerald-400 font-bold text-lg">${rxEq}</div>` : '<div class="text-slate-400">Hãy chọn một phản ứng bên dưới</div>'}
                `;
                globalTime++;
            },
            draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); const ox = this.origin.x; const oy = this.origin.y;
                
                // Màn hình chớp sáng nếu Mg cháy
                if(this.state.activeRx === 'mg_o2' && this.state.progress > 0 && this.state.progress < 3.0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()*0.3 + 0.1})`;
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                }

                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, oy, canvas.width, canvas.height - oy);
                ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(canvas.width, oy); ctx.strokeStyle = '#334155'; ctx.lineWidth = 4; ctx.stroke();

                if(this.state.activeRx !== 'mg_o2' && this.state.activeRx !== null) {
                    // Vẽ cốc Beaker cho phản ứng dung dịch
                    const bw = 60;
                    ctx.fillStyle = this.state.flaskColor;
                    ctx.fillRect(ox - bw, oy - 150, bw*2, 150);
                    
                    // Bọt khí
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    this.state.bubbles.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill(); });
                    
                    // Kết tủa
                    this.state.particles.filter(p=>p.isPrecipitate).forEach(p => {
                        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
                    });

                    // Vỏ cốc
                    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(ox-bw, oy-180); ctx.lineTo(ox-bw, oy); ctx.lineTo(ox+bw, oy); ctx.lineTo(ox+bw, oy-180); ctx.stroke();
                    
                    // Cục kẽm
                    if(this.state.activeRx === 'zn_hcl' && this.state.progress < 4.0) {
                        ctx.fillStyle = '#94a3b8'; ctx.fillRect(ox-15, oy-15, 30, 15);
                    }
                } else if (this.state.activeRx === 'mg_o2') {
                    // Đế đốt
                    ctx.fillStyle = '#475569'; ctx.fillRect(ox-30, oy-20, 60, 20);
                    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(ox-5, oy-40, 10, 20); // Dây Magie
                    // Hạt lửa
                    this.state.particles.forEach(p => {
                        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                        ctx.beginPath(); ctx.arc(p.x, p.y, Math.random()*4+2, 0, Math.PI*2); ctx.fill();
                        ctx.shadowColor = p.color; ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;
                    });
                    ctx.globalAlpha = 1.0;
                }
            },
            loop() { if(currentSim !== 'reactions') return; this.update(); this.draw(); animationId = requestAnimationFrame(() => this.loop()); }
        };

        // ==========================================
        // BIOLOGY SIMULATION: HỆ TIÊU HÓA (DIGESTIVE SYSTEM)
        // ==========================================
        simulations.digestive = {
            state: { showLabels: true, selectedOrgan: null, foodProgress: 0, isEating: false },
            origin: { x: 0, y: 0 },
            initPositions() { this.origin.x = canvas.width / 2; this.origin.y = canvas.height / 2; },
            init() { this.initPositions(); this.reset(); this.setupInteraction(); this.loop(); },
            reset() { this.state.showLabels = true; this.state.selectedOrgan = null; this.state.foodProgress = 0; this.state.isEating = false; },
            eat() { this.state.isEating = true; this.state.foodProgress = 0; },
            toggleLabels() {
                this.state.showLabels = !this.state.showLabels;
                const btn = document.getElementById('btn-dig-labels');
                if(btn) {
                    btn.className = `w-12 h-6 rounded-full ${this.state.showLabels ? 'bg-bio-500' : 'bg-slate-600'} relative transition-colors duration-300 focus:outline-none`;
                    btn.children[0].className = `w-4 h-4 rounded-full bg-white absolute top-1 transition-transform duration-300 ${this.state.showLabels ? 'translate-x-7' : 'translate-x-1'}`;
                }
            },
            setupInteraction() {
                canvas.onmousedown = (e) => {
                    if(currentSim !== 'digestive') return;
                    if(this.state.selectedOrgan) { this.state.selectedOrgan = null; return; }
                    
                    const r = canvas.getBoundingClientRect();
                    const cx = e.clientX - r.left; const cy = e.clientY - r.top;
                    const minDim = Math.min(canvas.width, canvas.height);
                    const scale = minDim < 600 ? minDim / 600 : 1;
                    let unX = (cx - this.origin.x) / scale; let unY = (cy - this.origin.y) / scale;
                    
                    const hits = [
                        { id: 'salivary', x: 20, y: -120, r: 15 },
                        { id: 'mouth', x: -10, y: -115, r: 20 },
                        { id: 'esophagus', x: 5, y: -70, r: 20 },
                        { id: 'stomach', x: 20, y: 5, r: 25 },
                        { id: 'liver', x: -15, y: -5, r: 35 },
                        { id: 'gallbladder', x: -10, y: 15, r: 10 },
                        { id: 'pancreas', x: 15, y: 18, r: 15 },
                        { id: 'largeIntestine', x: 0, y: 60, r: 40 },
                        { id: 'appendix', x: -28, y: 100, r: 15 },
                        { id: 'smallIntestine', x: 0, y: 60, r: 30 },
                        { id: 'rectum', x: 10, y: 105, r: 20 }
                    ];
                    
                    const orderedHits = ['appendix', 'gallbladder', 'pancreas', 'salivary', 'mouth', 'esophagus', 'stomach', 'smallIntestine', 'liver', 'largeIntestine', 'rectum'];
                    
                    for(let id of orderedHits) {
                        let h = hits.find(i => i.id === id);
                        if (h && Math.hypot(unX - h.x, unY - h.y) < h.r) { 
                            this.state.selectedOrgan = h.id; 
                            break; 
                        }
                    }
                };
            },
            update() {
                if(!isPaused) {
                    globalTime += timeScale;
                    if(this.state.isEating) {
                        this.state.foodProgress += 0.005 * timeScale;
                        if(this.state.foodProgress >= 1) {
                            this.state.isEating = false;
                            this.state.foodProgress = 0;
                        }
                    }
                }
                hudInfo.innerHTML = `
                    <div class="text-bio-400 font-bold mb-1"><i class="fa-solid fa-person-dots-from-line"></i> Giải phẫu Hệ Tiêu Hóa</div>
                    <div class="text-xs text-slate-300 mb-2 italic animate-pulse">👉 Click vào các cơ quan để xem chi tiết</div>
                `;
            },
            draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const ox = this.origin.x; const oy = this.origin.y;
                const minDim = Math.min(canvas.width, canvas.height);
                const scale = minDim < 600 ? minDim / 600 : 1.2; // Tăng scale nhẹ để dễ nhìn
                
                ctx.save();
                ctx.translate(ox, oy); ctx.scale(scale, scale); ctx.translate(-ox, -oy);

                // Bóng người (Silhouette) profile mặt trái
                ctx.fillStyle = 'rgba(148, 163, 184, 0.1)'; 
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)'; ctx.lineWidth = 2;
                ctx.beginPath(); 
                // Vẽ đầu
                ctx.arc(ox + 10, oy - 150, 35, -Math.PI/2, Math.PI*0.8); 
                // Mặt và Mũi
                ctx.bezierCurveTo(ox - 30, oy - 145, ox - 35, oy - 135, ox - 35, oy - 130); 
                ctx.lineTo(ox - 25, oy - 125); // Mũi thụt vào
                ctx.lineTo(ox - 35, oy - 120); // Môi trên
                ctx.lineTo(ox - 25, oy - 115); // Miệng
                ctx.lineTo(ox - 30, oy - 110); // Cằm
                ctx.lineTo(ox - 15, oy - 95); // Cổ
                // Vai và thân
                ctx.lineTo(ox - 50, oy - 70); 
                ctx.lineTo(ox - 80, oy + 50); // Tay trái
                ctx.lineTo(ox - 50, oy + 50); 
                ctx.lineTo(ox - 45, oy + 120); // Chân trái
                ctx.lineTo(ox + 45, oy + 120); // Chân phải
                ctx.lineTo(ox + 50, oy + 50); 
                ctx.lineTo(ox + 80, oy + 50); // Tay phải
                ctx.lineTo(ox + 50, oy - 70); 
                ctx.lineTo(ox + 30, oy - 90); // Cổ phải
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                ctx.globalAlpha = 0.95;

                // THÊM ĐỔ BÓNG (DROP SHADOW) CHO TOÀN BỘ NỘI TẠNG
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 5;

                // 1. Tuyến nước bọt (Salivary Gland)
                const salGrad = ctx.createRadialGradient(ox+15, oy-125, 2, ox+15, oy-125, 10);
                salGrad.addColorStop(0, '#fde68a'); salGrad.addColorStop(1, '#d97706');
                ctx.fillStyle = salGrad;
                ctx.beginPath(); ctx.ellipse(ox + 15, oy - 125, 8, 12, 0.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(ox + 25, oy - 115, 10, 6, -0.2, 0, Math.PI*2); ctx.fill();

                ctx.shadowColor = 'transparent';

                // 2. Khoang miệng & Thực quản (Mouth & Esophagus)
                const esoGrad = ctx.createLinearGradient(ox, oy-115, ox+10, oy-20);
                esoGrad.addColorStop(0, '#f472b6'); esoGrad.addColorStop(1, '#e11d48');
                ctx.strokeStyle = esoGrad; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath(); 
                ctx.moveTo(ox - 25, oy - 115); // Khớp với mồm
                ctx.lineTo(ox + 5, oy - 115); 
                ctx.quadraticCurveTo(ox + 10, oy - 115, ox + 10, oy - 100);
                ctx.lineTo(ox + 5, oy - 20); 
                ctx.stroke();

                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';

                // 3. Dạ dày (Stomach) - Gradient 3D
                const stomGrad = ctx.createRadialGradient(ox+15, oy, 5, ox+15, oy, 30);
                stomGrad.addColorStop(0, '#f472b6'); stomGrad.addColorStop(1, '#9d174d');
                ctx.fillStyle = stomGrad; ctx.strokeStyle = '#831843'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(ox + 5, oy - 20);
                ctx.bezierCurveTo(ox + 40, oy - 30, ox + 50, oy + 10, ox + 20, oy + 20);
                ctx.bezierCurveTo(ox + 5, oy + 25, ox - 5, oy + 15, ox + 10, oy + 10);
                ctx.bezierCurveTo(ox + 20, oy + 5, ox + 15, oy - 15, ox + 5, oy - 20);
                ctx.fill(); ctx.stroke();

                // Nếp gấp dạ dày (Rugae)
                ctx.shadowColor = 'transparent'; ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath(); ctx.moveTo(ox + 15, oy - 10); ctx.quadraticCurveTo(ox + 25, oy, ox + 15, oy + 10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(ox + 25, oy - 5); ctx.quadraticCurveTo(ox + 35, oy + 5, ox + 25, oy + 15); ctx.stroke();
                
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';

                // 4. Tuyến tụy (Pancreas)
                const panGrad = ctx.createLinearGradient(ox, oy+18, ox+30, oy+18);
                panGrad.addColorStop(0, '#fef08a'); panGrad.addColorStop(1, '#ca8a04');
                ctx.fillStyle = panGrad; ctx.strokeStyle = '#a16207';
                ctx.beginPath(); ctx.ellipse(ox + 15, oy + 18, 18, 6, 0.2, 0, Math.PI*2); ctx.fill(); ctx.stroke();

                // 5. Gan (Liver) - Gradient 3D sẫm màu
                const liverGrad = ctx.createRadialGradient(ox-10, oy-15, 5, ox-10, oy-15, 45);
                liverGrad.addColorStop(0, '#b91c1c'); liverGrad.addColorStop(1, '#450a0a');
                ctx.fillStyle = liverGrad; ctx.strokeStyle = '#450a0a';
                ctx.beginPath();
                ctx.moveTo(ox + 10, oy - 25);
                ctx.bezierCurveTo(ox - 10, oy - 40, ox - 45, oy - 25, ox - 45, oy);
                ctx.bezierCurveTo(ox - 40, oy + 15, ox - 10, oy + 15, ox + 10, oy - 5);
                ctx.bezierCurveTo(ox + 20, oy - 15, ox + 15, oy - 20, ox + 10, oy - 25);
                ctx.fill(); ctx.stroke();

                // Phân thùy gan (dòng kẻ nhẹ)
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.moveTo(ox - 10, oy - 30); ctx.quadraticCurveTo(ox - 5, oy - 15, ox + 5, oy - 5); ctx.stroke();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';

                // 6. Túi mật (Gallbladder)
                const gallGrad = ctx.createRadialGradient(ox-10, oy+12, 1, ox-10, oy+12, 6);
                gallGrad.addColorStop(0, '#4ade80'); gallGrad.addColorStop(1, '#064e3b');
                ctx.fillStyle = gallGrad; ctx.strokeStyle = '#022c22';
                ctx.beginPath(); ctx.ellipse(ox - 10, oy + 12, 5, 8, -0.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();

                ctx.shadowColor = 'transparent';

                // Tá tràng (Duodenum)
                ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 7;
                ctx.beginPath(); ctx.moveTo(ox + 20, oy + 20); ctx.quadraticCurveTo(ox + 5, oy + 30, ox - 10, oy + 25); ctx.stroke();

                // 7. Đại tràng (Large Intestine)
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                const colonGrad = ctx.createLinearGradient(ox-25, oy+35, ox+25, oy+85);
                colonGrad.addColorStop(0, '#d97706'); colonGrad.addColorStop(1, '#92400e');
                ctx.strokeStyle = colonGrad; ctx.lineWidth = 16; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ox - 25, oy + 85); // Manh tràng
                ctx.lineTo(ox - 25, oy + 35); // Lên
                ctx.lineTo(ox + 25, oy + 35); // Ngang
                ctx.lineTo(ox + 25, oy + 85); // Xuống
                ctx.stroke();
                
                // Ngấn đại tràng (Haustra)
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2;
                for(let i=0; i<=50; i+=6) {
                    ctx.beginPath(); ctx.moveTo(ox - 33, oy + 85 - i); ctx.lineTo(ox - 17, oy + 85 - i); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(ox + 33, oy + 85 - i); ctx.lineTo(ox + 17, oy + 85 - i); ctx.stroke();
                }
                for(let i=0; i<=50; i+=6) {
                    ctx.beginPath(); ctx.moveTo(ox - 25 + i, oy + 27); ctx.lineTo(ox - 25 + i, oy + 43); ctx.stroke();
                }

                // 8. Ruột non (Small Intestine)
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                const smallGrad = ctx.createLinearGradient(ox-15, oy+25, ox+15, oy+85);
                smallGrad.addColorStop(0, '#fca5a5'); smallGrad.addColorStop(1, '#e11d48');
                ctx.strokeStyle = smallGrad; ctx.lineWidth = 12; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                
                // Vẽ lòng vòng ruột non có phân cấp
                const drawSI = (paths) => {
                    paths.forEach(pts => {
                        ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
                        for(let i=2; i<pts.length; i+=2) ctx.lineTo(pts[i], pts[i+1]);
                        ctx.stroke();
                    });
                };
                drawSI([
                    [ox - 10, oy + 25, ox + 15, oy + 45],
                    [ox + 15, oy + 45, ox - 15, oy + 55],
                    [ox - 15, oy + 55, ox + 15, oy + 65],
                    [ox + 15, oy + 65, ox - 15, oy + 75],
                    [ox - 15, oy + 75, ox + 10, oy + 85],
                    [ox + 10, oy + 85, ox - 20, oy + 80]
                ]);

                // 9. Ruột thừa (Appendix)
                ctx.strokeStyle = '#b45309'; ctx.lineWidth = 6; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(ox - 25, oy + 85); ctx.quadraticCurveTo(ox - 32, oy + 95, ox - 28, oy + 100); ctx.stroke();

                // 10. Trực tràng / Hậu môn (Rectum/Anus)
                ctx.strokeStyle = '#b45309'; ctx.lineWidth = 12; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(ox + 25, oy + 85); ctx.quadraticCurveTo(ox + 5, oy + 95, ox + 10, oy + 115); ctx.stroke();

                ctx.shadowColor = 'transparent';

                // THỨC ĂN DI CHUYỂN
                if (this.state.isEating) {
                    const p = this.state.foodProgress;
                    let fx = 0, fy = 0;
                    // Lộ trình nội suy theo đúng đường ống
                    if(p < 0.1) { fx = ox - 25 + p*10*30; fy = oy - 115; } 
                    else if(p < 0.3) { fx = ox + 5; fy = oy - 115 + (p-0.1)*5*95; } 
                    else if(p < 0.4) { fx = ox + 5 + Math.sin((p-0.3)*10*Math.PI)*15; fy = oy - 20 + (p-0.3)*10*40; } 
                    else if(p < 0.7) { 
                        let sp = (p-0.4)*3.33; 
                        fx = ox + Math.sin(sp*Math.PI*5)*15;
                        fy = oy + 25 + sp*55;
                    } 
                    else if(p < 0.9) {
                        let lp = (p-0.7)*5; 
                        if(lp < 0.33) { fx = ox - 25; fy = oy + 85 - lp*3*50; } 
                        else if(lp < 0.66) { fx = ox - 25 + (lp-0.33)*3*50; fy = oy + 35; } 
                        else { fx = ox + 25; fy = oy + 35 + (lp-0.66)*3*50; } 
                    }
                    else {
                        let rp = (p-0.9)*10;
                        fx = ox + 25 - rp*15; fy = oy + 85 + rp*30;
                    }
                    ctx.fillStyle = '#65a30d'; 
                    ctx.beginPath(); ctx.arc(fx, fy, 6, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
                }

                // VẼ NHÃN (LABELS)
                if(this.state.showLabels && !this.state.selectedOrgan) {
                    ctx.fillStyle = 'white'; ctx.font = '13px Inter'; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
                    ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
                    const drawLabel = (lx, ly, text, tx, ty) => {
                        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(tx, ty); ctx.stroke();
                        let textW = ctx.measureText(text).width;
                        ctx.fillText(text, tx + (tx>lx?5:-textW-5), ty + 4);
                    };
                    
                    drawLabel(ox - 25, oy - 115, "Khoang miệng", ox - 90, oy - 125);
                    drawLabel(ox + 15, oy - 125, "Tuyến nước bọt", ox + 80, oy - 130);
                    drawLabel(ox + 5, oy - 60, "Thực quản", ox + 80, oy - 70);
                    drawLabel(ox - 25, oy - 10, "Gan", ox - 100, oy - 20);
                    drawLabel(ox + 30, oy, "Dạ dày", ox + 100, oy - 5);
                    drawLabel(ox - 10, oy + 12, "Túi mật", ox - 100, oy + 10);
                    drawLabel(ox + 15, oy + 18, "Tuyến tụy", ox + 100, oy + 25);
                    drawLabel(ox - 25, oy + 50, "Đại tràng", ox - 110, oy + 50);
                    drawLabel(ox + 15, oy + 50, "Ruột non", ox + 110, oy + 60);
                    drawLabel(ox - 28, oy + 100, "Ruột thừa", ox - 100, oy + 110);
                    drawLabel(ox, oy + 110, "Hậu môn", ox - 80, oy + 130);
                    drawLabel(ox + 10, oy + 100, "Trực tràng", ox + 100, oy + 110);
                    
                    ctx.shadowBlur = 0;
                }

                ctx.restore(); 
                
                // HIỂN THỊ MODAL BẢNG CHI TIẾT
                if(this.state.selectedOrgan) {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const modalW = Math.min(450, canvas.width - 40); const modalH = 220;
                    const mx = canvas.width/2 - modalW/2; const my = canvas.height/2 - modalH/2;
                    
                    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.roundRect(mx, my, modalW, modalH, 16); ctx.fill();
                    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2; ctx.stroke();
                    
                    const details = {
                        mouth: { n: "Khoang Miệng & Lưỡi", d: "Nơi bắt đầu của ống tiêu hóa. Thực hiện tiêu hóa cơ học (nhai, nghiền) và hóa học ban đầu nhờ amylase." },
                        salivary: { n: "Tuyến Nước Bọt", d: "Tiết ra nước bọt làm mềm thức ăn, chứa enzyme phân giải tinh bột." },
                        esophagus: { n: "Thực Quản", d: "Ống cơ dẫn thức ăn từ họng xuống dạ dày nhờ các luồng sóng nhu động trơn tru." },
                        liver: { n: "Gan", d: "Nhà máy hóa chất của cơ thể. Sản xuất dịch mật tiêu hóa mỡ, khử độc, và dự trữ Glycogen." },
                        stomach: { n: "Dạ Dày", d: "Túi cơ nhào trộn thức ăn. Tiết axit HCl và pepsin để tiêu diệt khuẩn và cắt đứt chuỗi protein." },
                        gallbladder: { n: "Túi Mật", d: "Dự trữ và cô đặc dịch mật từ gan, co bóp đẩy mật vào tá tràng khi có thức ăn chứa mỡ." },
                        pancreas: { n: "Tuyến Tụy", d: "Tiết dịch tụy chứa dồi dào enzyme (lipase, protease, amylase) đổ vào ruột non để tiêu hóa." },
                        smallIntestine: { n: "Ruột Non & Tá Tràng", d: "Nơi tiêu hóa hóa học triệt để nhất. Các lông ruột hấp thụ tối đa chất dinh dưỡng vào máu." },
                        largeIntestine: { n: "Đại Tràng (Ruột Già)", d: "Hấp thụ lại nước và khoáng chất. Các vi khuẩn cộng sinh lên men tạo phân." },
                        rectum: { n: "Trực Tràng & Hậu Môn", d: "Phần cuối cùng, lưu trữ phân và thực hiện phản xạ đẩy chất thải ra ngoài." },
                        appendix: { n: "Ruột Thừa", d: "Một túi tịt nhỏ ở manh tràng. Đóng vai trò như nơi trú ẩn của lợi khuẩn đường ruột." }
                    };
                    const info = details[this.state.selectedOrgan];
                    
                    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 22px Inter'; ctx.textAlign = 'center';
                    ctx.fillText(info.n, canvas.width/2, my + 50);
                    
                    ctx.fillStyle = '#e2e8f0'; ctx.font = '15px Inter'; ctx.textAlign = 'left';
                    const wrapText = (text, x, y, maxW, lineH) => {
                        let words = text.split(' '); let line = '';
                        for(let n = 0; n < words.length; n++) {
                            let testLine = line + words[n] + ' ';
                            if (ctx.measureText(testLine).width > maxW && n > 0) { ctx.fillText(line, x, y); line = words[n] + ' '; y += lineH; } 
                            else { line = testLine; }
                        }
                        ctx.fillText(line, x, y);
                    };
                    wrapText(info.d, mx + 30, my + 90, modalW - 60, 24);
                    
                    ctx.fillStyle = '#94a3b8'; ctx.font = 'italic 13px Inter'; ctx.textAlign = 'center';
                    ctx.fillText("Click bất kỳ đâu để đóng", canvas.width/2, my + modalH - 20);
                }
            },
            loop() { if(currentSim !== 'digestive') return; this.update(); this.draw(); animationId = requestAnimationFrame(() => this.loop()); }
        };

        // ==========================================
        // BIOLOGY SIMULATION: TẾ BÀO ĐỘNG VẬT (ANIMAL CELL)
        // ==========================================
        simulations.cell = {
            state: { activity: 1.0, showLabels: true, selectedOrganelle: null },
            origin: { x: 0, y: 0 },
            initPositions() { this.origin.x = canvas.width / 2; this.origin.y = canvas.height / 2; },
            init() { this.initPositions(); this.reset(); this.setupInteraction(); this.loop(); },
            reset() { this.state.activity = 1.0; this.state.showLabels = true; this.state.selectedOrganelle = null; document.getElementById('cell-act-val') && (document.getElementById('cell-act').value = 1.0); },
            setupInteraction() {
                canvas.onmousedown = (e) => {
                    if(currentSim !== 'cell') return;
                    if(this.state.selectedOrganelle) { this.state.selectedOrganelle = null; return; }
                    
                    const r = canvas.getBoundingClientRect();
                    const cx = e.clientX - r.left; const cy = e.clientY - r.top;
                    const minDim = Math.min(canvas.width, canvas.height);
                    const scale = minDim < 600 ? minDim / 600 : 1;
                    
                    let unX = (cx - this.origin.x) / scale; let unY = (cy - this.origin.y) / scale;
                    
                    const hits = [
                        { id: 'nucleolus', x: -5, y: -20, r: 25 }, { id: 'nucleus', x: -20, y: -30, r: 60 },
                        { id: 'golgi', x: 90, y: -20, r: 35 }, { id: 'mito', x: -60, y: 80, r: 30 }, { id: 'mito', x: 80, y: 100, r: 30 }, { id: 'mito', x: 10, y: -120, r: 30 },
                        { id: 'lysosome', x: -100, y: -20, r: 25 }, { id: 'lysosome', x: 40, y: 120, r: 25 }, { id: 'lysosome', x: -40, y: 140, r: 25 },
                        { id: 'centrosome', x: 120, y: 30, r: 30 }, { id: 'rer', x: -80, y: 30, r: 40 }, { id: 'ser', x: 70, y: 50, r: 35 },
                        { id: 'cytoplasm', x: 0, y: 0, r: 160 }, { id: 'membrane', x: 0, y: 0, r: 190 }
                    ];
                    
                    for(let h of hits) {
                        if (Math.hypot(unX - h.x, unY - h.y) < h.r) { 
                            this.state.selectedOrganelle = h.id; 
                            break; 
                        }
                    }
                };
            },
            toggleLabels() {
                this.state.showLabels = !this.state.showLabels;
                const btn = document.getElementById('btn-cell-labels');
                if(btn) {
                    btn.className = `w-12 h-6 rounded-full ${this.state.showLabels ? 'bg-bio-500' : 'bg-slate-600'} relative transition-colors duration-300 focus:outline-none`;
                    btn.children[0].className = `w-4 h-4 rounded-full bg-white absolute top-1 transition-transform duration-300 ${this.state.showLabels ? 'translate-x-7' : 'translate-x-1'}`;
                }
            },
            update() {
                if(!isPaused && !this.state.selectedOrganelle) globalTime += timeScale * this.state.activity;
                hudInfo.innerHTML = `
                    <div class="text-bio-400 font-bold mb-1"><i class="fa-solid fa-microscope"></i> Giải phẫu Tế Bào Động Vật</div>
                    <div class="text-xs text-slate-300 mb-2 italic animate-pulse">👉 Click vào các bào quan để phóng to</div>
                    <div>Nhân: <span class="text-white">Trung tâm điều khiển</span></div>
                    <div>Ty thể: <span class="text-white">Nhà máy năng lượng</span></div>
                    <div>Ribosome: <span class="text-white">Tổng hợp Protein</span></div>
                `;
            },
            drawMito(x, y, angle, scale) {
                ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(scale, scale);
                const mGrad = ctx.createRadialGradient(0,-5, 2, 0,0, 25);
                mGrad.addColorStop(0, '#38bdf8'); mGrad.addColorStop(1, '#0284c7');
                ctx.fillStyle = mGrad;
                ctx.beginPath(); ctx.ellipse(0, 0, 25, 12, 0, 0, Math.PI*2); ctx.fill();
                ctx.lineWidth = 1.5; ctx.strokeStyle = '#0c4a6e'; ctx.stroke();
                ctx.beginPath(); 
                ctx.moveTo(-18, 0); ctx.lineTo(-12, -8); ctx.lineTo(-6, 8); ctx.lineTo(0, -8); ctx.lineTo(6, 8); ctx.lineTo(12, -8); ctx.lineTo(18, 0);
                ctx.strokeStyle = '#bae6fd'; ctx.stroke();
                ctx.restore();
            },
            drawGolgi(x, y, angle) {
                ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
                ctx.fillStyle = '#f43f5e'; ctx.strokeStyle = '#881337'; ctx.lineWidth = 2;
                ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
                for(let i=0; i<4; i++) {
                    ctx.beginPath();
                    ctx.ellipse(0, i*8 - 12, 25 - Math.abs(i-1.5)*5, 4, 0, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke();
                }
                ctx.shadowColor = 'transparent';
                ctx.beginPath(); ctx.arc(-30, -5, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(25, 15, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.restore();
            },
            drawER(ox, oy, isRough) {
                ctx.strokeStyle = isRough ? '#f59e0b' : '#34d399'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                ctx.save(); ctx.translate(ox, oy);
                ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 3;
                for(let r = 75; r <= 105; r += 15) {
                    ctx.beginPath();
                    for(let a = 0; a < Math.PI; a += 0.2) {
                        let rr = r + Math.sin(a*10)*5;
                        let x = Math.cos(a) * rr; let y = Math.sin(a) * rr;
                        if(a===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                    }
                    ctx.stroke();
                    if(isRough) {
                        ctx.fillStyle = '#ef4444';
                        ctx.shadowColor = 'transparent';
                        for(let a = 0.1; a < Math.PI; a += 0.3) {
                            let rr = r + Math.sin(a*10)*5;
                            ctx.beginPath(); ctx.arc(Math.cos(a)*rr, Math.sin(a)*rr, 2, 0, Math.PI*2); ctx.fill();
                        }
                        ctx.shadowColor = 'rgba(0,0,0,0.2)';
                    }
                }
                ctx.restore();
            },
            draw() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                const ox = this.origin.x; const oy = this.origin.y;
                let wobble = Math.sin(globalTime * 0.05) * 2;

                const minDim = Math.min(canvas.width, canvas.height);
                const scale = minDim < 600 ? minDim / 600 : 1;
                
                ctx.save();
                ctx.translate(ox, oy); ctx.scale(scale, scale); ctx.translate(-ox, -oy);

                // 1. Tế bào chất & Màng (Gradient Cầu)
                const cellR = 180;
                const gradCell = ctx.createRadialGradient(ox - 50, oy - 50, 50, ox, oy, cellR);
                gradCell.addColorStop(0, '#ffedd5'); gradCell.addColorStop(1, '#fdba74');
                ctx.fillStyle = gradCell;
                
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 20;
                ctx.beginPath();
                for(let i=0; i<=Math.PI*2; i+=0.1) {
                    let r = cellR + Math.sin(i*6 + globalTime*0.02)*4;
                    if(i===0) ctx.moveTo(ox+r, oy); else ctx.lineTo(ox + r*Math.cos(i), oy + r*Math.sin(i));
                }
                ctx.fill();
                ctx.shadowColor = 'transparent';
                
                // Hạt Texture trong màng chất
                ctx.fillStyle = 'rgba(194, 65, 12, 0.1)';
                for(let i=0; i<150; i++) {
                    ctx.beginPath(); ctx.arc(ox + Math.sin(i*9)*140, oy + Math.cos(i*13)*140, Math.random()*3+1, 0, Math.PI*2); ctx.fill();
                }

                ctx.lineWidth = 6; ctx.strokeStyle = '#ea580c'; ctx.stroke();

                // 2. Nhân tế bào (Gradient Tím bóng)
                const nucX = ox - 20; const nucY = oy - 30 + wobble;
                const nucGrad = ctx.createRadialGradient(nucX-15, nucY-15, 10, nucX, nucY, 60);
                nucGrad.addColorStop(0, '#d8b4fe'); nucGrad.addColorStop(1, '#7e22ce');
                
                ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 10;
                ctx.fillStyle = nucGrad;
                ctx.beginPath(); ctx.arc(nucX, nucY, 60, 0, Math.PI*2); ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.lineWidth = 4; ctx.strokeStyle = '#4c1d95'; ctx.setLineDash([12, 6]); ctx.stroke(); ctx.setLineDash([]);
                
                // Sợi Chromatin trong nhân
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                for(let i=0; i<30; i++) {
                    ctx.beginPath(); ctx.arc(nucX + Math.sin(i*11)*45, nucY + Math.cos(i*7)*45, Math.random()*2, 0, Math.PI*2); ctx.fill();
                }

                // Nhãn con
                ctx.fillStyle = '#4c1d95';
                ctx.beginPath(); ctx.arc(nucX + 15, nucY + 10, 20, 0, Math.PI*2); ctx.fill();

                // 3. Lưới nội chất
                this.drawER(nucX, nucY, true); 
                ctx.save(); ctx.translate(nucX+80, nucY+60); ctx.rotate(-0.8); this.drawER(0,0, false); ctx.restore();

                // 4. Thể Golgi
                this.drawGolgi(ox + 90, oy - 20 - wobble*0.5, 0.5);

                // 5. Ty thể
                this.drawMito(ox - 60, oy + 80 + wobble, -0.2, 1.2);
                this.drawMito(ox + 80, oy + 100 - wobble, 0.8, 1);
                this.drawMito(ox + 10, oy - 120 + wobble*0.8, -1.0, 0.9);

                // 6. Lysosome
                ctx.strokeStyle = '#c2410c'; ctx.lineWidth=2;
                ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 5;
                const lysos = [[ox-100, oy-20], [ox+40, oy+120], [ox-40, oy+140]];
                lysos.forEach(p => { 
                    const lGrad = ctx.createRadialGradient(p[0]-3, p[1]-3+wobble, 2, p[0], p[1]+wobble, 12);
                    lGrad.addColorStop(0, '#fcd34d'); lGrad.addColorStop(1, '#ea580c');
                    ctx.fillStyle = lGrad;
                    ctx.beginPath(); ctx.arc(p[0], p[1] + wobble, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
                });
                ctx.shadowColor = 'transparent';

                // 7. Trung thể
                ctx.save(); ctx.translate(ox + 120, oy + 30); ctx.fillStyle = '#facc15';
                ctx.fillRect(-10, -4, 20, 8); ctx.save(); ctx.rotate(Math.PI/2); ctx.fillRect(-10, -4, 20, 8); ctx.restore();
                ctx.restore();

                // Ribosome tự do
                ctx.fillStyle = '#ef4444';
                for(let i=0; i<25; i++) {
                    ctx.beginPath(); ctx.arc(ox - 120 + (i*17)%200, oy - 80 + (i*23)%220, 2.5, 0, Math.PI*2); ctx.fill();
                }

                // Vẽ chú thích
                if(this.state.showLabels) {
                    ctx.fillStyle = 'white'; ctx.font = '13px Inter'; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
                    ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
                    const drawLabel = (lx, ly, text, tx, ty) => {
                        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(tx, ty); ctx.stroke();
                        let textW = ctx.measureText(text).width;
                        ctx.fillText(text, tx + (tx>lx?5:-textW-5), ty + 4);
                    };
                    
                    drawLabel(ox+cellR-10, oy, "Màng tế bào", ox+cellR+30, oy+20);
                    drawLabel(ox, oy+cellR-40, "Tế bào chất", ox, oy+cellR+20);
                    drawLabel(nucX-60, nucY, "Màng nhân", nucX-100, nucY-30);
                    drawLabel(nucX+15, nucY+10, "Nhân con", nucX-100, nucY+10);
                    drawLabel(nucX-70, nucY+40, "Lưới nội chất hạt", nucX-140, nucY+60);
                    drawLabel(ox+120, oy+80, "Lưới nội chất trơn", ox+160, oy+100);
                    drawLabel(ox+90, oy-20, "Thể Golgi", ox+150, oy-40);
                    drawLabel(ox-60, oy+80, "Ty thể", ox-140, oy+110);
                    drawLabel(ox-100, oy-20, "Lysosome", ox-160, oy-10);
                    drawLabel(ox+120, oy+30, "Trung thể", ox+180, oy+40);
                    ctx.shadowBlur = 0;
                }
                
                ctx.restore(); // Khôi phục scale

                // HIỂN THỊ MODAL BẢNG CHI TIẾT
                if(this.state.selectedOrganelle) {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const modalW = Math.min(450, canvas.width - 40); const modalH = 270;
                    const mx = canvas.width/2 - modalW/2; const my = canvas.height/2 - modalH/2;
                    
                    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.roundRect(mx, my, modalW, modalH, 16); ctx.fill();
                    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2; ctx.stroke();
                    
                    const details = {
                        nucleus: { n: "Nhân Tế Bào (Nucleus)", d: "Trung tâm điều khiển của tế bào. Chứa phần lớn vật chất di truyền (DNA) dưới dạng nhiễm sắc thể. Được bao bọc bởi màng nhân kép có lỗ màng nhân." },
                        nucleolus: { n: "Nhân Con (Nucleolus)", d: "Cấu trúc dạng hạt hình cầu nằm trong nhân tế bào. Đây là nơi diễn ra quá trình tổng hợp rARN để lắp ráp thành các tiểu đơn vị Ribosome." },
                        mito: { n: "Ty Thể (Mitochondria)", d: "Được ví như 'nhà máy năng lượng' của tế bào. Nơi diễn ra quá trình hô hấp tế bào, phân giải chất hữu cơ để tạo ra năng lượng ATP." },
                        golgi: { n: "Thể Golgi (Golgi Apparatus)", d: "Hệ thống các túi màng dẹp xếp chồng lên nhau. Chức năng chính là thu thập, sửa đổi, đóng gói và phân phối các sản phẩm (protein, lipid)." },
                        rer: { n: "Lưới Nội Chất Hạt (Rough ER)", d: "Hệ thống màng ống có đính vô số hạt Ribosome trên bề mặt. Đóng vai trò cực kỳ quan trọng trong việc tổng hợp và vận chuyển protein." },
                        ser: { n: "Lưới Nội Chất Trơn (Smooth ER)", d: "Hệ thống màng ống trơn nhẵn (không đính Ribosome). Tham gia vào quá trình tổng hợp lipid, chuyển hóa carbohydrate và giải độc tế bào." },
                        lysosome: { n: "Lysosome", d: "Bào quan dạng túi chứa nhiều enzyme thủy phân. Đóng vai trò là 'dạ dày' của tế bào, chuyên tiêu hóa nội bào và phân hủy bào quan già cỗi." },
                        centrosome: { n: "Trung Thể (Centrosome)", d: "Bào quan gồm 2 trung tử hình trụ xếp vuông góc với nhau. Đóng vai trò nòng cốt trong quá trình phân chia tế bào (tạo thoi vô sắc)." },
                        cytoplasm: { n: "Tế Bào Chất (Cytoplasm)", d: "Khối chất keo bán lỏng lấp đầy không gian bên trong màng tế bào. Chứa các bào quan và là môi trường diễn ra các phản ứng sinh hóa." },
                        membrane: { n: "Màng Tế Bào (Cell Membrane)", d: "Lớp màng phospholipid kép bao bọc bên ngoài. Kiểm soát chặt chẽ sự trao đổi chất giữa tế bào và môi trường xung quanh (tính thấm chọn lọc)." }
                    };
                    const info = details[this.state.selectedOrganelle];
                    
                    ctx.save(); ctx.translate(canvas.width/2, my + 65);
                    const so = this.state.selectedOrganelle;
                    if(so === 'mito') this.drawMito(0, 0, 0, 2.5);
                    else if(so === 'golgi') { ctx.scale(1.5, 1.5); this.drawGolgi(0, 0, 0); }
                    else if(so === 'lysosome') { const lGrad = ctx.createRadialGradient(-5,-5,4,0,0,25); lGrad.addColorStop(0,'#fcd34d'); lGrad.addColorStop(1,'#ea580c'); ctx.fillStyle = lGrad; ctx.strokeStyle = '#c2410c'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
                    else if(so === 'centrosome') { ctx.fillStyle = '#facc15'; ctx.scale(2, 2); ctx.fillRect(-10, -4, 20, 8); ctx.rotate(Math.PI/2); ctx.fillRect(-10, -4, 20, 8); }
                    else if(so === 'nucleus') { const nGrad=ctx.createRadialGradient(-10,-10,10,0,0,45); nGrad.addColorStop(0,'#d8b4fe'); nGrad.addColorStop(1,'#7e22ce'); ctx.fillStyle = nGrad; ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI*2); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#4c1d95'; ctx.setLineDash([8, 4]); ctx.stroke(); }
                    else if(so === 'nucleolus') { ctx.fillStyle = '#4c1d95'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill(); }
                    else if(so === 'rer') { ctx.scale(0.8, 0.8); this.drawER(0, 0, true); }
                    else if(so === 'ser') { ctx.scale(0.8, 0.8); this.drawER(0, 0, false); }
                    else if(so === 'membrane') { ctx.strokeStyle = '#fdba74'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, 40, 60, Math.PI+0.3, Math.PI*2-0.3); ctx.stroke(); }
                    else if(so === 'cytoplasm') { const g = ctx.createRadialGradient(-10, -10, 10, 0, 0, 40); g.addColorStop(0, '#ffedd5'); g.addColorStop(1, '#fdba74'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill(); }
                    ctx.restore();
                    
                    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 20px Inter'; ctx.textAlign = 'center';
                    ctx.fillText(info.n, canvas.width/2, my + 140);
                    
                    ctx.fillStyle = '#e2e8f0'; ctx.font = '14px Inter'; ctx.textAlign = 'left';
                    const wrapText = (text, x, y, maxW, lineH) => {
                        let words = text.split(' '); let line = '';
                        for(let n = 0; n < words.length; n++) {
                            let testLine = line + words[n] + ' ';
                            if (ctx.measureText(testLine).width > maxW && n > 0) { ctx.fillText(line, x, y); line = words[n] + ' '; y += lineH; } 
                            else { line = testLine; }
                        }
                        ctx.fillText(line, x, y);
                    };
                    wrapText(info.d, mx + 30, my + 175, modalW - 60, 22);
                    
                    ctx.fillStyle = '#94a3b8'; ctx.font = 'italic 12px Inter'; ctx.textAlign = 'center';
                    ctx.fillText("Click bất kỳ đâu để đóng", canvas.width/2, my + modalH - 15);
                }
            },
            loop() { if(currentSim !== 'cell') return; this.update(); this.draw(); animationId = requestAnimationFrame(() => this.loop()); }
        };

        // ==========================================
        // DYNAMIC CONTROLS BUILDER
        // ==========================================
        function buildControls(simName) {
            let html = '';
            const themeClass = currentDomain === 'physics' ? 'text-accent-400' : (currentDomain === 'chemistry' ? 'text-chem-400' : 'text-bio-400');

            const shadowClass = currentDomain === 'physics' ? 'shadow-[0_0_15px_rgba(2,132,199,0.5)]' : (currentDomain === 'chemistry' ? 'shadow-[0_0_15px_rgba(219,39,119,0.5)]' : 'shadow-[0_0_15px_rgba(22,163,74,0.5)]');

            if (currentDomain === 'physics') {
                html += `

                    html += `

                            ${createSlider('proj-angle', 'Góc bắn', 0, 90, 1, simulations.projectile.state.angle, '°', 'updateProjAngle')}
                            ${createSlider('proj-vel', 'Vận tốc', 1, 50, 1, simulations.projectile.state.velocity, ' m/s', 'updateProjVel')}

                        </button>`;
                } else if (simName === 'pendulum') {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                            <p class="text-xs text-slate-400 mb-2"><i class="fa-solid fa-info-circle ${themeClass}"></i> Kéo quả nặng để thả.</p>
                            ${createSlider('pend-length', 'Chiều dài', 50, 400, 10, simulations.pendulum.state.length, ' cm', 'updatePendLength')}
                            ${createSlider('pend-damp', 'Ma sát KK (0 = Không)', 0, 1, 0.05, 1-simulations.pendulum.state.damping, '', 'updatePendDamp')}
                        </div>`;
                } else if (simName === 'spring') {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                            ${createSlider('spring-k', 'Độ cứng (k)', 1, 50, 1, simulations.spring.state.k, ' N/m', 'updateSpringK')}
                            ${createSlider('spring-damp', 'Ma sát KK (0 = Không)', 0, 1, 0.05, 1-simulations.spring.state.damping, '', 'updateSpringDamp')}
                        </div>`;
                } else if (simName === 'hspring') {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                            ${createSlider('hspring-k', 'Độ cứng (k)', 5, 50, 1, simulations.hspring.state.k, ' N/m', 'updateHSpringK')}
                            ${createSlider('hspring-mu', 'Hệ số ma sát sàn (μ)', 0, 0.5, 0.01, simulations.hspring.state.mu, '', 'updateHSpringMu')}
                        </div>`;
                } else if (simName === 'gravity') {
                    html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                        <p class="text-xs text-slate-400"><i class="fa-solid fa-hand-pointer ${themeClass}"></i> Click vào màn hình đen để tạo hành tinh.</p>
                        ${createSlider('grav-sun', 'Khối lượng Sao', 1000, 30000, 1000, simulations.gravity.state.sunMass, ' M', 'updateGravSun')}
                    </div>`;
                } else if (simName === 'optics') {
                    html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                        ${createSlider('opt-angle', 'Góc tới', 0, 89, 1, simulations.optics.state.angleIncidence, '°', 'updateOptAngle')}
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                        <h3 class="text-white font-semibold text-sm mb-3">Môi trường 1 (Bên trên)</h3>
                        ${createSelect('opt-m1', 'Chất liệu', [{value:1.0,label:'Chân không/KK (n=1.0)'},{value:1.33,label:'Nước (n=1.33)'},{value:1.52,label:'Thủy tinh (n=1.52)'},{value:2.42,label:'Kim cương (n=2.42)'}], 'updateOptM1')}
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                        <h3 class="text-white font-semibold text-sm mb-3">Môi trường 2 (Bên dưới)</h3>
                        ${createSelect('opt-m2', 'Chất liệu', [{value:1.52,label:'Thủy tinh (n=1.52)'},{value:1.0,label:'Chân không/KK (n=1.0)'},{value:1.33,label:'Nước (n=1.33)'},{value:2.42,label:'Kim cương (n=2.42)'}], 'updateOptM2')}
                    </div>`;
                }
            } 
            else if (currentDomain === 'chemistry') {
                if (simName === 'titration') {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                            <h3 class="text-white font-semibold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-vial ${themeClass}"></i> Thuốc thử & Chất chỉ thị</h3>
                            <div class="flex gap-2 mb-3">
                                <button onclick="simulations.titration.dipLitmus()" class="flex-1 py-2 bg-purple-500 hover:bg-purple-400 text-white rounded-lg font-bold shadow-[0_0_10px_rgba(168,85,247,0.5)] transition-all active:scale-95 text-xs">
                                    <i class="fa-solid fa-scroll"></i> Nhúng Quỳ Tím
                                </button>
                            </div>
                            ${createSlider('chem-acid', 'Độ mạnh Axit (HCl, H2SO4)', 0.1, 3.0, 0.1, simulations.titration.state.acidStrength, '', 'updateChemAcid', colors.chem)}
                            ${createSlider('chem-base', 'Độ mạnh Bazơ (NaOH, KOH)', 0.1, 3.0, 0.1, simulations.titration.state.baseStrength, '', 'updateChemBase', colors.chem)}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="simulations.titration.addDrop('acid')" class="flex-1 py-3 bg-red-500 hover:bg-red-400 text-white rounded-xl font-bold shadow-[0_0_10px_rgba(239,68,68,0.5)] transition-all active:scale-95 text-xs px-1">
                                <i class="fa-solid fa-tint"></i> Axit
                            </button>
                            <button onclick="simulations.titration.addDrop('water')" class="flex-1 py-3 bg-slate-400 hover:bg-slate-300 text-white rounded-xl font-bold shadow-[0_0_10px_rgba(148,163,184,0.5)] transition-all active:scale-95 text-xs px-1">
                                <i class="fa-solid fa-droplet"></i> Nước cất
                            </button>
                            <button onclick="simulations.titration.addDrop('base')" class="flex-1 py-3 bg-blue-500 hover:bg-blue-400 text-white rounded-xl font-bold shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-all active:scale-95 text-xs px-1">
                                <i class="fa-solid fa-tint"></i> Bazơ
                            </button>
                        </div>
                    `;
                } else if (simName === 'reactions') {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                            <h3 class="text-white font-semibold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-fire ${themeClass}"></i> Chọn Phản Ứng</h3>
                            
                            <button onclick="simulations.reactions.trigger('mg_o2')" class="w-full py-2 bg-yellow-500 hover:bg-yellow-400 text-slate-900 rounded-lg font-bold shadow-lg transition-all active:scale-95 text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-bolt"></i> Đốt dây Magie (Mg + O₂)
                            </button>
                            
                            <button onclick="simulations.reactions.trigger('zn_hcl')" class="w-full py-2 bg-emerald-500 hover:bg-emerald-400 text-white rounded-lg font-bold shadow-lg transition-all active:scale-95 text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-bubbles"></i> Kẽm & Axit HCl (Zn + HCl)
                            </button>

                            <button onclick="simulations.reactions.trigger('cuso4_naoh')" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg transition-all active:scale-95 text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-flask"></i> Tạo kết tủa (CuSO₄ + NaOH)
                            </button>
                        </div>
                    `;
                }
            }
            else if (currentDomain === 'biology') {
                if (simName === 'digestive') {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                            <h3 class="text-white font-semibold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-person-dots-from-line ${themeClass}"></i> Quá trình</h3>
                            <button onclick="simulations.digestive.eat()" class="w-full py-3 bg-bio-600 hover:bg-bio-500 text-white rounded-xl font-bold shadow-[0_0_15px_rgba(22,163,74,0.5)] transition-all active:scale-95 text-sm mb-4">
                                <i class="fa-solid fa-cookie-bite mr-2"></i> Nuốt Thức Ăn
                            </button>
                            <div class="flex items-center justify-between mt-4 border-t border-slate-700 pt-4">
                                <span class="text-sm text-slate-300 font-medium">Hiển thị chú thích</span>
                                <button onclick="simulations.digestive.toggleLabels()" id="btn-dig-labels" class="w-12 h-6 rounded-full ${simulations.digestive.state.showLabels ? 'bg-bio-500' : 'bg-slate-600'} relative transition-colors duration-300 focus:outline-none">
                                    <div class="w-4 h-4 rounded-full bg-white absolute top-1 transition-transform duration-300 ${simulations.digestive.state.showLabels ? 'translate-x-7' : 'translate-x-1'}"></div>
                                </button>
                            </div>
                        </div>
                    `;
                } else if (simName === 'cell') {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                            <h3 class="text-white font-semibold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-microscope ${themeClass}"></i> Cấu trúc tế bào</h3>
                            ${createSlider('cell-act', 'Mức độ hoạt động', 0.1, 5.0, 0.1, simulations.cell.state.activity, 'x', 'updateCellAct', colors.bio)}
                            <div class="flex items-center justify-between mt-4 border-t border-slate-700 pt-4">
                                <span class="text-sm text-slate-300 font-medium">Hiển thị chú thích</span>
                                <button onclick="simulations.cell.toggleLabels()" id="btn-cell-labels" class="w-12 h-6 rounded-full ${simulations.cell.state.showLabels ? 'bg-bio-500' : 'bg-slate-600'} relative transition-colors duration-300 focus:outline-none">
                                    <div class="w-4 h-4 rounded-full bg-white absolute top-1 transition-transform duration-300 ${simulations.cell.state.showLabels ? 'translate-x-7' : 'translate-x-1'}"></div>
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            controlsContainer.innerHTML = html;
        }

        window.updateProjAngle = (v) => { simulations.projectile.state.angle = v; if(!simulations.projectile.state.isFiring) simulations.projectile.draw(); };
        window.updateProjVel = (v) => simulations.projectile.state.velocity = v;
        
        window.updatePendLength = (v) => { simulations.pendulum.state.length = v; simulations.pendulum.updateBobPos(); simulations.pendulum.draw(); };
        window.updatePendDamp = (v) => simulations.pendulum.state.damping = 1 - (v/10); 

        window.updateSpringK = (v) => simulations.spring.state.k = v;
        window.updateSpringDamp = (v) => simulations.spring.state.damping = 1 - (v/10);
        
        window.updateHSpringK = (v) => simulations.hspring.state.k = v;
        window.updateHSpringMu = (v) => simulations.hspring.state.mu = v;

        window.updateGravSun = (v) => simulations.gravity.state.sunMass = v;
        window.updateOptAngle = (v) => simulations.optics.state.angleIncidence = v;
        window.updateOptM1 = (v) => simulations.optics.state.n1 = parseFloat(v);
        window.updateOptM2 = (v) => simulations.optics.state.n2 = parseFloat(v);

        window.updateChemAcid = (v) => simulations.titration.state.acidStrength = v;
        window.updateChemBase = (v) => simulations.titration.state.baseStrength = v;

        window.updateTimeScale = (v) => timeScale = v;

        window.updateCellAct = (v) => simulations.cell.state.activity = v;

    </script>
</body>
</html>
