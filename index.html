<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Khoa Học Tự Nhiên</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for energy graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151f32', 900: '#0f172a', },
                        accent: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', },
                        chem: { 400: '#f472b6', 500: '#ec4899', 600: '#db2777', },
                        bio: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        canvas {
            display: block; width: 100%; height: 100%;
            background-color: #1e293b; border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
            cursor: crosshair;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: currentColor; cursor: pointer; margin-top: -6px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px; }
        input[type=range]:focus { outline: none; }
        
        .domain-btn.active-physics { border-bottom: 2px solid #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .domain-btn.active-chem { border-bottom: 2px solid #f472b6; color: #f472b6; background: rgba(244, 114, 182, 0.1); }
        .domain-btn.active-bio { border-bottom: 2px solid #4ade80; color: #4ade80; background: rgba(74, 222, 128, 0.1); }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-screen w-full relative">

    <!-- MÀN HÌNH CHÍNH (LANDING PAGE) -->
    <div id="landing-page" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 bg-grid">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-accent-500/10 blur-[100px] rounded-full pointer-events-none"></div>

        <div class="absolute top-6 left-6 md:left-8 flex flex-col items-start gap-3 z-10">
            <p class="text-slate-400 text-sm font-medium tracking-wide bg-slate-800/80 backdrop-blur-sm px-4 py-2 rounded-lg border border-slate-700 shadow-lg">
                Đội ngũ phát triển: <span class="text-white font-bold ml-1">Nguyễn Tiến Thành</span>
            </p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScR34xYraffjvpPhGypNgXRpeOW7q09wMXHwcMwNN6E-MSPTQ/viewform?usp=sharing&ouid=100350003607814510703" target="_blank" rel="noopener noreferrer" class="group flex items-center gap-2 text-slate-300 hover:text-white text-sm font-medium transition-all duration-300 bg-slate-800/80 backdrop-blur-sm hover:bg-slate-700 px-4 py-2 rounded-lg border border-slate-700 hover:border-accent-400 shadow-lg">
                <i class="fa-regular fa-comment-dots text-accent-400 group-hover:-translate-y-0.5 transition-transform"></i> Góp ý sản phẩm
            </a>
        </div>

        <div class="text-center mb-12 relative z-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-slate-800 border border-slate-700 text-white text-4xl shadow-xl mb-6">
                <i class="fa-solid fa-flask"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight mb-3">Mô Phỏng Khoa Học Tự Nhiên</h1>
            <p class="text-lg text-slate-400 font-medium">Virtual Sandbox Laboratory</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl px-6 relative z-10 w-full">
            <button onclick="enterDomain('physics')" class="group relative bg-slate-800/80 backdrop-blur-sm border border-slate-700 hover:border-accent-400 rounded-2xl p-8 text-left transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_10px_30px_rgba(56,189,248,0.2)]">
                <div class="w-14 h-14 rounded-xl bg-accent-500/20 text-accent-400 flex items-center justify-center text-2xl mb-6 transition-transform group-hover:scale-110 group-hover:rotate-12">
                    <i class="fa-solid fa-atom"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2 group-hover:text-accent-400 transition-colors">Vật Lý</h2>
                <p class="text-slate-400 text-sm leading-relaxed">Mô phỏng chuyển động ném xiên, dao động con lắc, lò xo đàn hồi, hệ thống hấp dẫn và khúc xạ ánh sáng.</p>
            </button>

            <button onclick="enterDomain('chemistry')" class="group relative bg-slate-800/80 backdrop-blur-sm border border-slate-700 hover:border-chem-400 rounded-2xl p-8 text-left transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_10px_30px_rgba(244,114,182,0.2)]">
                <div class="w-14 h-14 rounded-xl bg-chem-500/20 text-chem-400 flex items-center justify-center text-2xl mb-6 transition-transform group-hover:scale-110 group-hover:-rotate-12">
                    <i class="fa-solid fa-vial"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2 group-hover:text-chem-400 transition-colors">Hóa Học</h2>
                <p class="text-slate-400 text-sm leading-relaxed">Tiến hành chuẩn độ dung dịch Axit - Bazơ, nhúng quỳ tím và quan sát các phản ứng hóa học trực quan.</p>
            </button>

            <button onclick="enterDomain('biology')" class="group relative bg-slate-800/80 backdrop-blur-sm border border-slate-700 hover:border-bio-400 rounded-2xl p-8 text-left transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_10px_30px_rgba(74,222,128,0.2)]">
                <div class="w-14 h-14 rounded-xl bg-bio-500/20 text-bio-400 flex items-center justify-center text-2xl mb-6 transition-transform group-hover:scale-110 group-hover:rotate-12">
                    <i class="fa-solid fa-dna"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2 group-hover:text-bio-400 transition-colors">Sinh Học</h2>
                <p class="text-slate-400 text-sm leading-relaxed">Mô phỏng giải phẫu hệ tiêu hóa và tương tác chi tiết với các cấu trúc bên trong tế bào động vật.</p>
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH MÔ PHỎNG (APP CONTAINER) -->
    <div id="app-container" class="hidden h-screen w-full flex-col md:flex-row absolute inset-0 z-40 bg-slate-900">
        <aside class="w-full md:w-[350px] bg-slate-850 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col h-1/3 md:h-full z-10 shadow-xl flex-shrink-0">
            <div class="p-4 border-b border-slate-700 flex items-center justify-between bg-slate-900">
                <div class="flex items-center gap-3">
                    <div id="main-icon" class="w-10 h-10 rounded-lg bg-accent-500/20 text-accent-400 flex items-center justify-center text-xl shadow-lg">
                        <i class="fa-solid fa-flask"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white">Mô Phỏng KHTN</h1>
                        <p class="text-xs text-slate-400 font-medium">Virtual Laboratory</p>
                    </div>
                </div>
                <button onclick="goHome()" title="Về Trang Chủ" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-rose-500 text-slate-400 hover:text-white border border-slate-700 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-house"></i>
                </button>
            </div>

            <div class="flex border-b border-slate-700 bg-slate-850">
                <button onclick="switchDomain('physics')" id="tab-physics" class="domain-btn active-physics flex-1 py-3 text-sm font-semibold transition text-slate-400 hover:text-white flex flex-col items-center gap-1">
                    <i class="fa-solid fa-atom text-lg"></i> Vật Lý
                </button>
                <button onclick="switchDomain('chemistry')" id="tab-chem" class="domain-btn flex-1 py-3 text-sm font-semibold transition text-slate-400 hover:text-white flex flex-col items-center gap-1">
                    <i class="fa-solid fa-vial text-lg"></i> Hóa Học
                </button>
                <button onclick="switchDomain('biology')" id="tab-bio" class="domain-btn flex-1 py-3 text-sm font-semibold transition text-slate-400 hover:text-white flex flex-col items-center gap-1">
                    <i class="fa-solid fa-dna text-lg"></i> Sinh Học
                </button>
            </div>

            <div id="sub-sims-menu" class="p-3 bg-slate-900 border-b border-slate-700 flex gap-2 overflow-x-auto snap-x hide-scrollbar"></div>

            <div class="flex-1 overflow-y-auto p-4 space-y-5" id="controls-container"></div>

            <div class="p-4 border-t border-slate-700 bg-slate-850 flex gap-3">
                <button onclick="resetCurrentSim()" class="flex-1 py-2 px-4 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Đặt Lại
                </button>
                <button onclick="togglePause()" id="pause-btn" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition text-white flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-pause"></i> Dừng
                </button>
            </div>
        </aside>

        <main class="flex-1 relative bg-slate-900 p-4 md:p-6 flex flex-col h-2/3 md:h-full">
            <div class="flex-1 relative w-full h-full rounded-xl overflow-hidden border border-slate-700 shadow-2xl bg-slate-800">
                <div class="absolute inset-0 pointer-events-none" style="background-image: linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px); background-size: 50px 50px; opacity: 0.15;"></div>
                <canvas id="simCanvas"></canvas>
                <div id="hud-info" class="absolute top-4 left-4 pointer-events-none bg-slate-900/80 backdrop-blur-sm p-3 rounded-lg border border-slate-700 text-sm font-mono text-white space-y-1 shadow-lg"></div>
            </div>

            <div id="chart-container" class="hidden h-48 w-full mt-4 bg-slate-800 rounded-xl border border-slate-700 p-4 relative">
                 <canvas id="energyChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const controlsContainer = document.getElementById('controls-container');
        const hudInfo = document.getElementById('hud-info');
        const subSimsMenu = document.getElementById('sub-sims-menu');
        
        let currentDomain = 'physics';
        let currentSim = 'projectile';
        let isPaused = false;
        let animationId;
        let globalTime = 0; 
        let timeScale = 1.0;
        
        function enterDomain(domain) {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('landing-page').classList.remove('flex');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('flex');
            
            setTimeout(() => { resizeCanvas(); switchDomain(domain); }, 50);
        }

        function goHome() {
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('flex');
            document.getElementById('landing-page').classList.remove('hidden');
            document.getElementById('landing-page').classList.add('flex');
            cancelAnimationFrame(animationId);
            isPaused = true;
        }

        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            if(simulations[currentSim] && simulations[currentSim].initPositions) {
                simulations[currentSim].initPositions();
            }
        }
        window.addEventListener('resize', resizeCanvas);

        const colors = { bg: '#1e293b', grid: '#334155', accent: '#38bdf8', danger: '#f43f5e', success: '#10b981', text: '#e2e8f0', physics: '#38bdf8', chem: '#f472b6', bio: '#4ade80' };

        const simRegistry = {
            physics: [
                { id: 'projectile', icon: 'fa-rocket', name: 'Ném Xiên' }, { id: 'pendulum', icon: 'fa-stopwatch', name: 'Con Lắc' },
                { id: 'spring', icon: 'fa-water', name: 'Lò Xo Dọc' }, { id: 'hspring', icon: 'fa-arrows-left-right-to-line', name: 'Lò Xo Ngang' },
                { id: 'gravity', icon: 'fa-earth-moon', name: 'Hấp Dẫn' }, { id: 'optics', icon: 'fa-lightbulb', name: 'Khúc Xạ' }
            ],
            chemistry: [
                { id: 'titration', icon: 'fa-vial-circle-check', name: 'Chuẩn độ & Quỳ tím' },
                { id: 'reactions', icon: 'fa-fire-flame-curved', name: 'Phản Ứng Hóa Học' }
            ],
            biology: [
                { id: 'digestive', icon: 'fa-person-dots-from-line', name: 'Hệ Tiêu Hóa' }, { id: 'cell', icon: 'fa-microscope', name: 'Tế Bào' }
            ]
        };

        const simulations = {}; 

        function switchDomain(domain) {
            currentDomain = domain;
            document.querySelectorAll('.domain-btn').forEach(btn => { btn.classList.remove('active-physics', 'active-chem', 'active-bio'); });
            let themeColorClass = domain === 'physics' ? 'active-physics' : (domain === 'chemistry' ? 'active-chem' : 'active-bio');
            document.getElementById(`tab-${domain === 'chemistry' ? 'chem' : (domain === 'biology' ? 'bio' : 'physics')}`).classList.add(themeColorClass);
            
            const iconEl = document.getElementById('main-icon');
            iconEl.className = `w-10 h-10 rounded-lg flex items-center justify-center text-xl shadow-lg ${domain === 'physics' ? 'bg-accent-500/20 text-accent-400' : (domain === 'chemistry' ? 'bg-chem-500/20 text-chem-400' : 'bg-bio-500/20 text-bio-400')}`;
            iconEl.innerHTML = `<i class="fa-solid ${domain === 'physics' ? 'fa-atom fa-spin-pulse' : (domain === 'chemistry' ? 'fa-flask fa-shake' : 'fa-dna fa-spin')}"></i>`;

            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.className = `flex-1 py-2 px-4 rounded-lg text-sm font-medium transition text-white flex items-center justify-center gap-2 shadow-lg ${domain === 'physics' ? 'bg-accent-600 hover:bg-accent-500' : (domain === 'chemistry' ? 'bg-chem-600 hover:bg-chem-500' : 'bg-bio-600 hover:bg-bio-500')}`;

            let subMenuHtml = '';
            simRegistry[domain].forEach(sim => {
                subMenuHtml += `<button onclick="switchSim('${sim.id}')" id="btn-${sim.id}" class="sim-tab flex-1 min-w-[80px] py-2 px-3 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium text-sm transition flex flex-col items-center gap-1 snap-start whitespace-nowrap"><i class="fa-solid ${sim.icon}"></i> ${sim.name}</button>`;
            });
            subSimsMenu.innerHTML = subMenuHtml;
            switchSim(simRegistry[domain][0].id);
        }

        function switchSim(simName) {
            currentSim = simName; isPaused = false;
            document.getElementById('pause-btn').innerHTML = '<i class="fa-solid fa-pause"></i> Dừng';
            document.querySelectorAll('.sim-tab').forEach(tab => { tab.className = 'sim-tab flex-1 min-w-[80px] py-2 px-3 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium text-sm transition flex flex-col items-center gap-1 snap-start whitespace-nowrap'; });
            const activeTab = document.getElementById(`btn-${simName}`);
            const bgClass = currentDomain === 'physics' ? 'bg-accent-600' : (currentDomain === 'chemistry' ? 'bg-chem-600' : 'bg-bio-600');
            activeTab.className = `sim-tab flex-1 min-w-[80px] py-2 px-3 rounded-md ${bgClass} text-white font-medium text-sm transition flex flex-col items-center gap-1 snap-start whitespace-nowrap shadow-lg shadow-black/20`;

            document.getElementById('chart-container').classList.toggle('hidden', (simName !== 'pendulum' && simName !== 'spring' && simName !== 'hspring'));
            resizeCanvas(); cancelAnimationFrame(animationId); buildControls(simName);
            if(simulations[simName]) simulations[simName].init();
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pause-btn');
            const bgClass = currentDomain === 'physics' ? 'bg-accent-600' : (currentDomain === 'chemistry' ? 'bg-chem-600' : 'bg-bio-600');
            const hoverClass = currentDomain === 'physics' ? 'hover:bg-accent-500' : (currentDomain === 'chemistry' ? 'hover:bg-chem-500' : 'hover:bg-bio-500');

            if(isPaused) {
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Tiếp tục';
                btn.className = `flex-1 py-2 px-4 rounded-lg text-sm font-medium transition text-white flex items-center justify-center gap-2 shadow-lg bg-emerald-500 hover:bg-emerald-400`;
            } else {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Dừng';
                btn.className = `flex-1 py-2 px-4 rounded-lg text-sm font-medium transition text-white flex items-center justify-center gap-2 shadow-lg ${bgClass} ${hoverClass}`;
            }
        }

        function resetCurrentSim() {
            isPaused = false;
            const btn = document.getElementById('pause-btn');
            const bgClass = currentDomain === 'physics' ? 'bg-accent-600' : (currentDomain === 'chemistry' ? 'bg-chem-600' : 'bg-bio-600');
            const hoverClass = currentDomain === 'physics' ? 'hover:bg-accent-500' : (currentDomain === 'chemistry' ? 'hover:bg-chem-500' : 'hover:bg-bio-500');
            btn.innerHTML = '<i class="fa-solid fa-pause"></i> Dừng';
            btn.className = `flex-1 py-2 px-4 rounded-lg text-sm font-medium transition text-white flex items-center justify-center gap-2 shadow-lg ${bgClass} ${hoverClass}`;
            
            globalTime = 0; if(simulations[currentSim]) simulations[currentSim].reset();
            if (energyChartInstance) { energyChartInstance.data.labels = []; energyChartInstance.data.datasets.forEach(ds => ds.data = []); energyChartInstance.update('none'); }
        }

        function createSlider(id, label, min, max, step, value, unit, onChange, colorHex = '#38bdf8') {
            return `<div class="space-y-1 text-${currentDomain}">
                    <div class="flex justify-between text-sm"><label class="text-slate-300 font-medium">${label}</label><span id="${id}-val" class="font-mono font-bold" style="color: ${colorHex}">${value}${unit}</span></div>
                    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" style="color: ${colorHex}" oninput="document.getElementById('${id}-val').innerText = this.value + '${unit}'; ${onChange}(parseFloat(this.value))">
                </div>`;
        }

        function createSelect(id, label, options, onChange) {
            let optsHtml = options.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('');
            return `<div class="space-y-1"><label class="text-slate-300 font-medium text-sm">${label}</label><select id="${id}" onchange="${onChange}(this.value)" class="w-full bg-slate-900 border border-slate-700 text-white rounded-md p-2 text-sm focus:outline-none">${optsHtml}</select></div>`;
        }

        let energyChartInstance = null;
        function initEnergyChart(labelKe, labelPe, labelTe, colorKe, colorPe, colorTe) {
            const ctxChart = document.getElementById('energyChart').getContext('2d');
            if(energyChartInstance) energyChartInstance.destroy();
            Chart.defaults.color = '#94a3b8'; Chart.defaults.font.family = 'Inter';
            energyChartInstance = new Chart(ctxChart, {
                type: 'line',
                data: { labels: [], datasets: [ { label: labelKe, borderColor: colorKe, data: [], pointRadius: 0, borderWidth: 2, tension: 0.4 }, { label: labelPe, borderColor: colorPe, data: [], pointRadius: 0, borderWidth: 2, tension: 0.4 }, { label: labelTe, borderColor: colorTe, data: [], pointRadius: 0, borderWidth: 2, borderDash: [5, 5] } ] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'top', labels: { boxWidth: 12, usePointStyle: true } } }, scales: { x: { display: false }, y: { beginAtZero: false, grid: { color: '#334155' } } } }
            });
        }

        // ==========================================
        // PHYSICS SIMULATIONS
        // ==========================================
        simulations.projectile = {
            state: { angle: 45, velocity: 20, gravity: 9.8, mass: 1, drag: 0, bounciness: 0.6, x: 0, y: 0, vx: 0, vy: 0, time: 0, isFiring: false, path: [], scale: 10, particles: [] },
            origin: { x: 50, y: 0 },
            initPositions() { this.origin.y = canvas.height - 50; if(!this.state.isFiring) { this.state.x = 0; this.state.y = 0; this.state.path = []; } },
            init() { this.initPositions(); this.reset(); this.loop(); },
            reset() { this.state.isFiring = false; this.state.x = 0; this.state.y = 0; this.state.time = 0; this.state.path = []; this.state.particles = []; this.draw(); },
            fire() {
                this.reset(); this.state.isFiring = true; const rad = this.state.angle * Math.PI / 180;
                this.state.vx = this.state.velocity * Math.cos(rad); this.state.vy = -this.state.velocity * Math.sin(rad);
                this.spawnExplosion(this.origin.x + 40*Math.cos(-rad), this.origin.y + 40*Math.sin(-rad), 20, '#cbd5e1');
            },
            spawnExplosion(px, py, count, color) { for(let i=0; i<count; i++) this.state.particles.push({ x: px, y: py, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 2, life: 1.0, decay: Math.random() * 0.05 + 0.02, color: color }); },
            update() {
                if(isPaused) return;
                for(let i = this.state.particles.length - 1; i >= 0; i--) { let p = this.state.particles[i]; p.x += p.vx * timeScale; p.y += p.vy * timeScale; p.vy += 0.2 * timeScale; p.life -= p.decay * timeScale; if(p.life <= 0) this.state.particles.splice(i, 1); }
                if (!this.state.isFiring) { this.draw(); return; }
                const dt = 0.05 * timeScale; this.state.time += dt;
                const dragAccX = -(this.state.drag / this.state.mass) * this.state.vx; const dragAccY = -(this.state.drag / this.state.mass) * this.state.vy;
                this.state.vx += dragAccX * dt; this.state.vy += (this.state.gravity + dragAccY) * dt;
                this.state.x += this.state.vx * dt; this.state.y += this.state.vy * dt;
